<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація на спортивний захід</title>
</head>
<body>

<h1>Реєстрація на спортивний захід</h1>

<form>
    <label for="name">Ім'я:</label>
    <input type="text" id="name" name="name" required>
    <br><br>

    <label for="surname">Прізвище:</label>
    <input type="text" id="surname" name="surname" required>
    <br><br>

    <label for="email">Електронна пошта:</label>
    <input type="email" id="email" name="email" required>
    <br><br>

    <label for="phone">Номер телефону:</label>
    <input type="tel" id="phone" name="phone">
    <br><br>

    <label for="age">Вік:</label>
    <input type="number" id="age" name="age" min="12" max="80">
    <br><br>

    <label for="date">Дата участі:</label>
    <input type="date" id="date" name="date" required>
    <br><br>

    <p><b>Оберіть дистанцію:</b></p>
    <input type="radio" id="km2" name="distance" value="2 км" required>
    <label for="km2">2 км</label><br>

    <input type="radio" id="km5" name="distance" value="5 км">
    <label for="km5">5 км</label><br>

    <input type="radio" id="km10" name="distance" value="10 км">
    <label for="km10">10 км</label>

    <p><b>Додаткові можливості:</b></p>
    <input type="checkbox" id="shirt" name="shirt">
    <label for="shirt">Отримати футболку</label><br>

    <input type="checkbox" id="medal" name="medal">
    <label for="medal">Отримати медаль</label><br>

    <input type="checkbox" id="news" name="news">
    <label for="news">Отримувати новини про наступні заходи</label><br>

    <input type="checkbox" id="rating" name="rating">
    <label for="rating">Додати результати до загального рейтингу</label>

    <br><br>

    <label for="category">Категорія учасника:</label>
    <select id="category" name="category">
        <option value="student_school">Учень</option>
        <option value="student">Студент</option>
        <option value="adult">Дорослий</option>
        <option value="other">Інша категорія</option>
    </select>

    <br><br>

    <label for="info">Додаткова інформація для організаторів:</label><br>
    <textarea id="info" name="info" maxlength="250" rows="5" cols="40"></textarea>

    <br><br>

    <button type="submit">Зареєструватися</button>
    <button type="reset">Очистити</button>
</form>

</body>
</html>
